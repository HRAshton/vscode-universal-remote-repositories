name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag matches extension version
        shell: bash
        run: |
          version="$(node --print "require('./packages/extension/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci
      - run: pnpm run package:vsix
      - run: pnpm run package:vsix:datacenter
      - run: pnpm --filter @remote/bitbucket-datacenter-userscript build
      - run: cp packages/userscript/dist/bitbucket-vscode.user.js artifacts/bitbucket-datacenter-vscode.user.js
      - run: cp packages/userscript/dist/bitbucket-vscode-workbench-relay.js artifacts/bitbucket-datacenter-workbench-relay.js
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.vsix *.js > SHA256SUMS
      - name: Attest extension provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/universal-remote-repositories.vsix
            artifacts/universal-remote-repositories-datacenter.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension
          path: artifacts/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension
          path: artifacts
      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            artifacts/universal-remote-repositories.vsix \
            artifacts/universal-remote-repositories-datacenter.vsix \
            artifacts/bitbucket-datacenter-vscode.user.js \
            artifacts/bitbucket-datacenter-workbench-relay.js \
            artifacts/SHA256SUMS \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${release_flags[@]}"
